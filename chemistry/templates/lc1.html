{% extends "layout.html" %}

{% block title %}
    Learning Check 1
{% endblock %}

{% block main %}
    <h1 class="text-center">Learning Check 1</h1>
    <br><br>
    <form action="/lc1" method="post" class="text-left">
        <div class="mb-3">
            {% for question in questions %}
                <h5>{{question["question"]}}</h5>
                    {% for option in question["options"] %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name='{{question["number"]}}' value='{{option}}'>
                            <label class="form-check-label" for="flexRadioDefault1">
                            {{option}}
                            </label>
                        </div>
                    {% endfor %}
                    <br><br>
            {% endfor %}
        </div>
        <button class="btn btn-primary" type="submit">Submit</button>
    </form>
{% endblock %}
